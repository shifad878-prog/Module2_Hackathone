<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Recipies</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="bootstrap.css">
</head>

<body>
    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">

        <div class="container">

            <!-- Logo -->

            <a class="navbar-brand fw-bold fs-3" href="dashboard.html">

                <span>Recipe</span>
                <span>Share</span>

            </a>


            <!-- Mobile Toggle -->

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse" id="navbarNav">


                <!-- Navigation -->

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">

                        <a class="nav-link fw-semibold px-3" href="dashboard.html">
                            Dashboard
                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link fw-semibold px-3" href="./myRecipe.html">
                            All Recipes
                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link fw-semibold px-3" href="./createRecipe.html">
                            + Add Recipe
                        </a>

                    </li>

                </ul>


            </div>

        </div>

    </nav>



    <!-- ================= MAIN ================= -->

    <main class="container py-5">


        <!-- Heading -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h1 class="fw-bold">
                    My Recipes
                </h1>

                <p class="text-muted mb-0">
                    Manage the recipes you have created.
                </p>

            </div>


            <a href="./createRecipe.html" class="btn btn-warning fw-semibold">

                + Add Recipe

            </a>

        </div>



        <!-- ================= NO RECIPES ================= -->

        <div id="noRecipesMessage" class="text-center py-5 d-none">

            <div style="font-size:60px;">
                🍳
            </div>

            <h3 class="fw-bold mt-3">
                No Recipes Yet
            </h3>

            <p class="text-muted">
                You haven't created any recipes yet.
            </p>

            <a href="./createRecipe.html" class="btn btn-warning">

                + Create Your First Recipe

            </a>

        </div>



        <!-- ================= RECIPE CARDS ================= -->

        <div id="myRecipesContainer" class="row g-4">

            <!-- JavaScript se recipes yahan ayengi -->

        </div>


    </main>

    <!-- Bootstrap -->

    <script src="./js/bootstrap.js"></script>

    <!-- Supabase -->

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- My Recipes JS -->

    <script src="./js/myRecipe.js"></script>


    <!-- SweetAlert -->

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
